name: Release

# Builds the distributable system and publishes it as a GitHub release, on one of
# two channels (scripts/prepare-release-manifest.mjs stamps the manifest for each):
#
#   * nightly — every push to `main` (or a manual dispatch) republishes the
#     rolling, ephemeral PRE-RELEASE under the fixed `nightly` tag, so testers can
#     install from a stable manifest URL. Version = src/system.json's prerelease
#     base + this workflow's run_number (0.0.1-alpha.N). Not an official release.
#   * release — pushing a `v<semver>` tag cuts an OFFICIAL versioned release. The
#     tag must equal src/system.json's committed version (bump it, commit, tag).
#     It runs the full `pnpm check` gate first. The published manifest URL is the
#     /releases/latest/ alias (installs follow future releases); the download URL
#     is pinned to the tag, so each version's manifest fetches its own zip — the
#     form the Foundry package listing expects. A tag with a prerelease label
#     (v1.1.0-rc.1) publishes as a prerelease and never becomes "latest".
#
# What ships: system code (sheets, rules engine, settings, lang, templates), the
# LICENSE/notice/README, and the PUBLIC generic packs in src/packs (empty until
# authored). The copyrighted book content is the `src/packs-private` submodule —
# never checked out here, never built, never shipped. The published system.json
# declares exactly the packs built into dist/packs, so Foundry never hunts for a
# declared pack dir that isn't in the zip.
#
# The nightly channel intentionally does NOT gate on ci.yml (ci.yml is the
# quality gate on the same push); a build that fails to compile publishes nothing.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # required to create/update releases

concurrency:
  group: release-${{ github.ref }}
  # A newer main push supersedes an in-flight nightly; a tagged release is never cancelled.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  publish:
    name: Build + publish (${{ startsWith(github.ref, 'refs/tags/v') && 'release' || 'nightly' }})
    runs-on: ubuntu-latest
    env:
      CHANNEL: ${{ startsWith(github.ref, 'refs/tags/v') && 'release' || 'nightly' }}
      TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'nightly' }}
      RUN: ${{ github.run_number }}
      REPO_URL: https://github.com/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false # src/packs-private (private/copyright) is not checked out or shipped

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # An official release must pass the same gate ci.yml enforces on main.
      - if: env.CHANNEL == 'release'
        run: pnpm check

      - run: pnpm build:system
      - run: pnpm build:compendium

      - name: Stamp version + manifest URLs; declare only the built packs
        run: node scripts/prepare-release-manifest.mjs

      - name: Package system zip (system.json at zip root)
        run: |
          test -f dist/system.json
          test -f dist/LICENSE
          cd dist
          zip -r -9 ../wh40k-rpg.zip .

      - name: Publish rolling `nightly` prerelease
        if: env.CHANNEL == 'nightly'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: Nightly build (pre-release)
          prerelease: true
          make_latest: false
          target_commitish: ${{ github.sha }} # re-point the nightly tag at this build
          body: |
            Automated rolling build of `main`. Ephemeral, pre-release. Ships the public generic packs only (no copyrighted content).
            Commit: ${{ github.sha }}

            Install in Foundry → Game Systems → Install System → paste Manifest URL:
            `${{ env.REPO_URL }}/releases/download/nightly/system.json`
          files: |
            dist/system.json
            wh40k-rpg.zip

      - name: Publish versioned release
        if: env.CHANNEL == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
          generate_release_notes: true
          body: |
            Ships system code and the public generic packs only (no copyrighted content).

            Install in Foundry → Game Systems → Install System → paste Manifest URL:
            `${{ env.REPO_URL }}/releases/latest/download/system.json`
          files: |
            dist/system.json
            wh40k-rpg.zip
